<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Setup - Computer Science Department</title>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #131b2e; padding: 30px; border-radius: 8px; width: 360px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; background-color: #1e3a8a; color: #93c5fd; margin-bottom: 10px; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px 0; border-radius: 4px; border: 1px solid #1e293b; background: #1a233a; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 11px; background-color: #3b82f6; border: none; color: white; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #2563eb; }
        .msg { color: #f87171; font-size: 13px; margin-bottom: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">{{ role }} ACCOUNT SETUP</span>
        <h3 style="margin: 0 0 5px 0; color: #fff;">First-Time Account Setup</h3>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Setting password for: <strong>{{ email }}</strong></p>

        {% if messages %}
            {% for message in messages %}
                <div class="msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <label style="font-size: 12px; color: #cbd5e1;">Create Password</label>
            <input type="password" name="password" required placeholder="Minimum 6 characters">
            
            <label style="font-size: 12px; color: #cbd5e1;">Confirm Password</label>
            <input type="password" name="confirm_password" required placeholder="Re-enter password">
            
            <button type="submit">Set Password & Continue</button>
        </form>
    </div>
</body>
</html>
