<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password</title>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 30px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-group { margin-bottom: 16px; }
        label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 6px; color: #cbd5e1; }
        input[type="password"] { width: 100%; padding: 10px 12px; background-color: #0f172a; border: 1px solid #1e293b; border-radius: 6px; color: #fff; box-sizing: border-box; outline: none; }
        .btn-submit { width: 100%; background-color: #3b82f6; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .alert { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="color: #fff; margin-top: 0;">Set New Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% if validlink %}
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label>Create Password</label>
            <input type="password" name="password" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn-submit">Reset Password</button>
    </form>
    {% else %}
        <p style="color: #94a3b8; font-size: 14px;">Password reset session expired.</p>
        <a href="{% url 'students:password_reset_request' %}" style="color: #3b82f6; text-decoration: none; font-size: 14px;">Request New Link</a>
    {% endif %}
</div>

</body>
</html>
